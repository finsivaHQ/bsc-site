<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" fill="none">
  <!-- Background Canvas -->
  <rect width="400" height="240" rx="16" fill="#FAF7F4" stroke="#E8DED9" stroke-width="2"/>
  
  <!-- Ambient Soft Rose Glow -->
  <circle cx="200" cy="120" r="90" fill="#C9828C" fill-opacity="0.12" filter="blur(20px)"/>

  <!-- Torso Silhouette Outline -->
  <path d="M140 40 C140 40, 160 50, 200 50 C240 50, 260 40, 260 40 L265 90 C265 105, 255 125, 245 135 C240 140, 235 180, 235 210 L165 210 C165 180, 160 140, 155 135 C145 125, 135 105, 135 90 Z" fill="#FFFFFF" stroke="#33252B" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Bust Curves -->
  <path d="M140 85 C145 115, 185 125, 200 125 C215 125, 255 115, 260 85" stroke="#A95563" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Measuring Tape around Ribcage (Underbust Line) -->
  <path d="M130 132 L270 132" stroke="#A95563" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round"/>
  <rect x="180" y="122" width="40" height="20" rx="4" fill="#A95563"/>
  <text x="200" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SNUG</text>

  <!-- Label Badge -->
  <rect x="120" y="180" width="160" height="28" rx="14" fill="#F4E6E8" stroke="#E8DED9" stroke-width="1.5"/>
  <text x="200" y="198" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#33252B" text-anchor="middle">1. UNDERBUST MEASUREMENT</text>
</svg>

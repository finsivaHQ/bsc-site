<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Warm Ivory Background Canvas -->
  <rect width="1200" height="630" fill="#FAF7F4"/>
  
  <!-- Subtle Soft Beige Frame Border -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="#FFFFFF" stroke="#E8DED9" stroke-width="4"/>
  
  <!-- Soft Ambient Dusty Rose Glow -->
  <circle cx="600" cy="220" r="280" fill="#C9828C" fill-opacity="0.12" filter="blur(60px)"/>

  <!-- Pill Badge: BRA SIZE CALCULATOR -->
  <g transform="translate(600, 150)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#F4E6E8" stroke="#E8DED9" stroke-width="2"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#A95563" text-anchor="middle" letter-spacing="3">BRA SIZE CALCULATOR</text>
  </g>

  <!-- Main Wordmark: BraSizeChecker -->
  <text x="600" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#33252B" text-anchor="middle" letter-spacing="-1">
    BraSize<tspan fill="#A95563" font-weight="600">Checker</tspan>
  </text>

  <!-- Tagline: Find Your Perfect Bra Size -->
  <text x="600" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" fill="#33252B" text-anchor="middle">
    Find Your Perfect Bra Size.
  </text>

  <!-- Sub-heading text -->
  <text x="600" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#66585D" text-anchor="middle">
    Free, private bra size calculator with sister sizes and international conversion charts.
  </text>

  <!-- Feature Chips Row -->
  <g transform="translate(600, 490)">
    <!-- Chip 1: 100% Free & Private -->
    <g transform="translate(-230, 0)">
      <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#FAF7F4" stroke="#E8DED9" stroke-width="2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#33252B" text-anchor="middle">🔒 100% Free &amp; Private</text>
    </g>
    
    <!-- Chip 2: US / UK / EU Conversion -->
    <g transform="translate(0, 0)">
      <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#FAF7F4" stroke="#E8DED9" stroke-width="2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#33252B" text-anchor="middle">🌐 US, UK &amp; EU Charts</text>
    </g>
    
    <!-- Chip 3: Sister Sizes -->
    <g transform="translate(230, 0)">
      <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#FAF7F4" stroke="#E8DED9" stroke-width="2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#33252B" text-anchor="middle">✨ Sister Size Guide</text>
    </g>
  </g>
</svg>
